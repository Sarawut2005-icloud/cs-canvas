packages:
  - 'backend'
  - 'frontend'

# pnpm 10+ บล็อก build script ของ dependency โดยค่าเริ่มต้น
# Prisma ต้องรัน postinstall เพื่อเตรียม engine จึงต้องอนุญาตไว้
allowBuilds:
  '@parcel/watcher': true
  '@tailwindcss/oxide': true
  '@prisma/engines': true
  bcrypt: true
  prisma: true
  sharp: true
  unrs-resolver: true
